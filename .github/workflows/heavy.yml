# Builds the slow layers (docs/building.md): the Metal host DLLs (LLVM/Clang 20 for MinGW) and the Swift libraries.
# Run it by hand (Actions -> Heavy build -> Run workflow) when Metal, the MSL compiler or Swift change; release.yml
# takes its artifacts. Experimental: these jobs have not been run end to end on GitHub's runners yet.
name: Heavy build
on:
  workflow_dispatch:

env:
  PACKAGES: clang-18 lld-18 llvm-18 clang-20 llvm-20 mingw-w64 cmake ninja-build libboost-dev python3

jobs:
  metal:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update && sudo apt-get install -y $PACKAGES
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
      - name: Cache LLVM 20 for MinGW
        uses: actions/cache@v4
        with:
          path: deps/llvm20
          key: llvm20-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/build-llvm-mingw.sh', 'patches/clang-msl.patch', 'patches/mingw.cmake') }}
      - run: scripts/fetch-deps.sh --metal
      - name: Build LLVM 20 for MinGW (hours, once)
        run: '[ -d deps/llvm20/build-win/lib ] && ls deps/llvm20/build-win/lib/libclang*.a >/dev/null 2>&1 || scripts/build-llvm-mingw.sh'
      - run: src/build_metal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: scion-metal
          path: |
            bin/scion-metal.dll
            bin/scion-msl.dll

  swift:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update && sudo apt-get install -y $PACKAGES
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
      - name: Swift 6.1.3 toolchain
        run: |
          curl -sSL https://download.swift.org/swift-6.1.3-release/ubuntu2404/swift-6.1.3-RELEASE/swift-6.1.3-RELEASE-ubuntu24.04.tar.gz | tar xz -C "$RUNNER_TEMP"
          # the scripts expect the layout of Ubuntu's swiftlang package (usr/libexec/swift/{bin,lib})
          mkdir -p "$RUNNER_TEMP/tc/libexec" && ln -s "$RUNNER_TEMP/swift-6.1.3-RELEASE-ubuntu24.04/usr" "$RUNNER_TEMP/tc/libexec/swift"
          echo "SWIFT_TC=$RUNNER_TEMP/tc" >> "$GITHUB_ENV"
      - run: |
          scripts/fetch-deps.sh --swift
          scripts/build-dynarmic.sh
      - name: Build Scion (core, which the Swift libraries link against)
        run: src/build.sh
      - name: Build the Swift libraries
        run: |
          ls bin/lib > /tmp/core.txt
          src/build_swift.sh
          src/build_swift_overlays.sh
          src/build_swift_concurrency.sh
          src/build_swiftui.sh
          mkdir -p swift-lib && ls bin/lib | grep -vxFf /tmp/core.txt | sed 's|^|bin/lib/|' | xargs cp -t swift-lib
      - uses: actions/upload-artifact@v4
        with:
          name: scion-swift
          path: swift-lib/
