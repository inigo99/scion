name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One job builds everything; the test jobs (Wine, the native Linux host, Windows) and the fuzzers then run side by side
# on its artifacts.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      # clang-20 (and llvm-20, with llvm-20-dev) build the modern-AIR test metallib (tests/metal/air/mkmetallib.py)
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 clang-20 mingw-w64 cmake ninja-build libboost-dev python3 golang \
            libsdl2-dev libfreetype-dev libfontconfig-dev libpng-dev libjpeg-turbo8-dev llvm-20-dev libvulkan-dev libzstd-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/build-dynarmic.sh', 'patches/**') }}

      - name: Fetch and build dependencies
        run: |
          scripts/fetch-deps.sh
          [ -f deps/dynarmic/build-win/src/dynarmic/libdynarmic.a ] || scripts/build-dynarmic.sh
          [ -f deps/dynarmic/build-linux/src/dynarmic/libdynarmic.a ] || scripts/build-dynarmic.sh --linux

      - name: Build Scion (core)
        run: src/build.sh

      # The MSL compiler of the native host links a patched Clang (20 minutes or so, cached)
      - name: Cache the patched Clang for Linux
        uses: actions/cache@v6
        with:
          path: |
            deps/llvm20/clang/include
            deps/llvm20/build-linux/include
            deps/llvm20/build-linux/lib/libclang*.a
          key: clang-linux-${{ hashFiles('patches/clang-msl.patch', 'scripts/build-clang-linux.sh') }}

      - name: Build scion-metal.so and scion-msl.so (native Linux host)
        run: |
          if [ ! -f deps/llvm20/build-linux/lib/libclangCodeGen.a ]; then
            scripts/fetch-deps.sh --metal
            scripts/build-clang-linux.sh
          fi
          src/build_metal.sh --linux

      # The Metal host DLLs and the Swift libraries take hours to build; CI reuses them from the latest release when
      # there is one, and otherwise skips the tests that need them.
      - name: Reuse the Metal and Swift libraries of the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern '*windows-x64.zip' --dir /tmp/release 2>/dev/null; then
            unzip -q /tmp/release/*.zip -d /tmp/release/x
            cp --update=none /tmp/release/x/*/scion-metal.dll /tmp/release/x/*/scion-msl.dll bin/ || true
            cp --update=none /tmp/release/x/*/lib/*.dylib bin/lib/ || true
          fi
          [ -f bin/scion-metal.dll ] || echo "skip=Metal|MSL|AppKit|2D drawing" >> "$GITHUB_OUTPUT"

      - name: Build the tests
        run: tests/build.sh

      # artifacts do not keep file modes: the archive does
      - name: Pack the build and the tests
        run: tar cf build.tar bin out/tests

      - uses: actions/upload-artifact@v7
        with:
          name: scion-build
          path: build.tar
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host: [wine, native]
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libsdl2-2.0-0 libfreetype6 libfontconfig1 libpng16-16t64 \
            libjpeg-turbo8 libvulkan1 libllvm20 ${{ matrix.host == 'wine' && 'wine64' || '' }}
      - uses: actions/download-artifact@v8
        with:
          name: scion-build
      - run: tar xf build.tar
      - name: Run the tests (${{ matrix.host }})
        env:
          SCION_SKIP: ${{ needs.build.outputs.skip }}
        run: |
          if [ ${{ matrix.host }} = wine ]; then
            mkdir -p /run/user/$(id -u) || true
            wineboot -i >/dev/null 2>&1 || true
          else
            export SCION="$PWD/bin/scion"
          fi
          tests/run.sh

  # The same tests on real Windows. GitHub's runners have no Vulkan driver, so the tests that need Metal are skipped
  # (the AppKit and drawing tests include an MTKView). Experimental until it has been green for a while.
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: scion-build
      - run: tar xf build.tar
      - name: Run the tests (Windows)
        env:
          SCION_SKIP: Metal|MSL|AppKit|2D drawing
        run: powershell -ExecutionPolicy Bypass -File tests\run.ps1

  # The readers of files that come with an app (Mach-O, Info.plist, .icns, LZFSE), with libFuzzer, ASan and UBSan
  fuzz:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev llvm-18
          sudo sysctl vm.mmap_rnd_bits=28   # ASan's shadow memory and the runners' address randomization
      - uses: actions/download-artifact@v8
        with:
          name: scion-build
      - run: tar xf build.tar
      - name: Fuzz (1 minute per reader; longer runs: tests/fuzz/run.sh SECONDS)
        run: tests/fuzz/run.sh 60
      - name: Keep the findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: out/fuzz/*/*-*
